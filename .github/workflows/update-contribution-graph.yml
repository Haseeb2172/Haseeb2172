name: Update contribution graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - assets/contribution-graph.svg

  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          PROFILE_NAME: Abdul Haseeb
        run: python scripts/generate_contribution_graph.py

      - name: Commit the updated graph
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- assets/contribution-graph.svg)" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg
          git commit -m "chore: update contribution graph [skip ci]"
          git push
